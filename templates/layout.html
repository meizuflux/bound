<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find other college students on your flight. From campus to home and back again, make the trip together.">
    <title>{% block title %}Bound — See who's on your flight{% endblock %}</title>
    <link rel="stylesheet" href="/public/compiled/css/app.css">
    <script src="/public/compiled/js/htmx.min.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-10 focus:rounded focus:bg-white focus:p-3">Skip to content</a>
    <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-7 sm:px-10">
      <a href="/" aria-label="Bound home" class="text-2xl font-bold tracking-tight">bound</a>
      <a href="/account" class="text-sm underline-offset-4 hover:underline">Account</a>
    </header>

    <main id="main-content" class="flex flex-1 items-center justify-center">
      {% block content %}{% endblock %}
    </main>

    <footer class="mx-auto w-full max-w-6xl px-6 py-7 text-sm sm:px-10">
      <nav aria-label="Footer">
        <a href="/" class="text-muted underline-offset-4 hover:underline">Home</a>
      </nav>
    </footer>
  </body>
</html>
