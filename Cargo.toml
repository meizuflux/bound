[package]
name = "bound"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
salvo = { version = "1.0.1", features = ["serve-static", "affix-state"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
askama = "0.14.0"
dotenvy = "0.15.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
