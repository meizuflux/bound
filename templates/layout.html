<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find other college students on your flight. From campus to home and back again, make the trip together.">
    <title>{% block title %}Bound — See who's on your flight{% endblock %}</title>
    <link rel="stylesheet" href="/public/compiled/css/app.css">
    <script src="/public/compiled/js/htmx.min.js" defer></script>
    <script src="/public/js/app.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-10 focus:rounded focus:bg-white focus:p-3">Skip to content</a>
    <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-7 sm:px-10">
      <a href="/" aria-label="Bound home" class="text-2xl font-bold tracking-tight">bound</a>
      <nav aria-label="Main" class="flex items-center gap-5 text-sm">
        <a href="/flights/mine" class="underline-offset-4 hover:underline">My flights</a>
        <a href="/account" class="underline-offset-4 hover:underline">Account</a>
      </nav>
    </header>

    <main id="main-content" class="flex flex-1 items-center justify-center">
      {% block content %}{% endblock %}
    </main>

    <footer class="mt-12 border-t border-ink/15 bg-ink/[0.025]">
      <div class="mx-auto flex w-full max-w-6xl items-end justify-between gap-6 px-6 py-10 sm:px-10 sm:py-12">
        <div>
          <a href="/" aria-label="Bound home" class="text-2xl font-bold tracking-tight">bound</a>
          <ul class="mt-4 space-y-1 text-muted text-sm">
            <li><a href="/flights" class="underline-offset-4 hover:text-ink hover:underline">Find your flight</a></li>
            <li><a href="/flights/mine" class="underline-offset-4 hover:text-ink hover:underline">My flights</a></li>
            <li><a href="/account" class="underline-offset-4 hover:text-ink hover:underline">Your account</a></li>
          </ul>
        </div>
        <div class="shrink-0 text-sm">
          <a href="https://github.com/meizuflux/bound" class="font-medium underline underline-offset-4">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
